[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "property-to-selfies"
version = "0.1.0"
description = "Property-conditioned Transformer decoder for SELFIES generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
